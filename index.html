<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AIS Windows EC-KPI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;background:#0A1628;font-family:'DM Sans',sans-serif;color:#fff;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(0,180,216,.3);border-radius:99px}
input[type=date],input[type=time]{color-scheme:dark}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #0c1d38 inset!important;-webkit-text-fill-color:#fff!important}
select option{background:#0c1d38;color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
.ani-fade{animation:fadeIn .38s ease both}
.ani-slide{animation:slideIn .32s ease both}
.app{display:flex;height:100vh;overflow:hidden}
.sb{display:flex;flex-direction:column;flex-shrink:0;background:rgba(7,16,32,.97);border-right:1px solid rgba(0,180,216,.11);transition:width .28s ease;overflow:hidden;z-index:20}
.sb.wide{width:224px}.sb.slim{width:58px}
.sb-logo{display:flex;align-items:center;gap:9px;padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.logo-pill{width:32px;min-width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#00B4D8,#0096C7);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:.05em}
.logo-info{overflow:hidden;white-space:nowrap}
.logo-info p{font-size:13px;font-weight:700;letter-spacing:.04em;font-family:'Rajdhani',sans-serif}
.logo-info span{font-size:9px;color:rgba(0,180,216,.65)}
.sb-toggle{margin-left:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.65);cursor:pointer;padding:6px 8px;border-radius:7px;font-size:16px;flex-shrink:0;line-height:1;transition:all .15s}
.sb-toggle:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.vo-badge{margin:7px 7px 0;padding:5px 8px;border-radius:8px;background:rgba(255,215,0,.09);border:1px solid rgba(255,215,0,.2);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.vo-badge span{font-size:9px;font-weight:600;color:#FFD700}
.sb-nav{flex:1;overflow-y:auto;padding:5px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.nav-item{width:100%;display:flex;align-items:center;gap:8px;padding:7px 7px;border-radius:9px;margin-bottom:2px;border:1px solid transparent;cursor:pointer;background:none;text-align:left;transition:all .13s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:rgba(255,255,255,.055)}
.nav-item:focus-visible{outline:2px solid #00B4D8;outline-offset:2px}
.nav-item.act{background:rgba(0,180,216,.13);border-color:rgba(0,180,216,.26)}
.nav-ico{width:22px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:6px;background:rgba(255,255,255,.04);flex-shrink:0}
.nav-item.act .nav-ico{background:rgba(0,180,216,.18)}
.nav-txt p{font-size:10.5px;font-weight:500;color:rgba(255,255,255,.62);line-height:1.2}
.nav-item.act .nav-txt p{color:#fff}
.nav-txt span{font-size:8.5px;color:rgba(0,180,216,.5)}
.sb-foot{padding:6px 5px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.main{display:flex;flex-direction:column;flex:1;min-width:0;overflow:hidden}
.hdr{display:flex;align-items:center;gap:9px;padding:8px 15px;background:rgba(7,16,32,.92);border-bottom:1px solid rgba(0,180,216,.09);flex-shrink:0;backdrop-filter:blur(14px);flex-wrap:wrap}
.hdr-title p{font-size:13px;font-weight:600;font-family:'Rajdhani',sans-serif;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.hdr-title span{font-size:9px;color:rgba(255,255,255,.35)}
.hdr-sep{flex:1}
.date-strip{display:flex;gap:2px;padding:3px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.dp{padding:5px 10px;border-radius:7px;font-size:10px;font-weight:500;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.42);transition:all .13s;font-family:inherit;white-space:nowrap}
.dp.act{background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff}
.dp:focus-visible{outline:2px solid #00B4D8;outline-offset:2px}
.active-range-lbl{font-size:9px;color:rgba(0,180,216,.65);white-space:nowrap;border:1px solid rgba(0,180,216,.2);border-radius:5px;padding:2px 7px;background:rgba(0,180,216,.07)}
.hdr-user{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#00B4D8,#0096C7);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.hdr-user p{font-size:10px;font-weight:500;white-space:nowrap}
.hdr-user span{font-size:8.5px;color:rgba(255,255,255,.35)}
.content{flex:1;overflow-y:auto;padding:13px 15px;scrollbar-width:thin;scrollbar-color:rgba(0,180,216,.22) transparent}
.ov-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:13px}
.ov-card{border-radius:13px;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;transition:transform .18s}
.ov-card:hover{transform:translateY(-2px)}
.ov-glow{position:absolute;top:-14px;right:-14px;width:64px;height:64px;border-radius:50%;opacity:.15;pointer-events:none}
.ov-ico{display:inline-flex;padding:6px;border-radius:8px;margin-bottom:8px;font-size:13px;position:relative;z-index:1}
.ov-trend{position:absolute;top:8px;right:8px;font-size:8px;font-weight:700;padding:2px 5px;border-radius:5px}
.tup{background:rgba(74,222,128,.14);color:#4ADE80}
.tdn{background:rgba(248,113,113,.14);color:#F87171}
.ov-val{font-size:20px;font-weight:700;font-family:'Rajdhani',sans-serif;position:relative;z-index:1}
.ov-lbl{font-size:9.5px;color:rgba(255,255,255,.6);margin-top:1px}
.ov-sub{font-size:8.5px;color:rgba(255,255,255,.3);margin-top:1px}
.kc{border-radius:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:13px;overflow:hidden}
.kc-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(0,180,216,.025);transition:background .13s}
.kc-hdr:hover{background:rgba(255,255,255,.04)}
.kc-left{display:flex;align-items:center;gap:9px}
.kc-num{width:28px;height:28px;min-width:28px;border-radius:8px;background:linear-gradient(135deg,#00B4D8,#0096C7);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Rajdhani',sans-serif}
.kc-title p{font-size:12px;font-weight:600;font-family:'Rajdhani',sans-serif;letter-spacing:.03em}
.kc-title span{font-size:8.5px;padding:1px 7px;border-radius:99px;background:rgba(0,180,216,.13);color:#00B4D8;display:inline-block;margin-top:2px}
.kc-right{display:flex;align-items:center;gap:7px}
.add-btn{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:7px;border:none;background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff;font-size:9px;font-weight:600;cursor:pointer;transition:all .13s;font-family:inherit}
.add-btn:hover{transform:scale(1.05)}
.add-btn:focus-visible,.dp:focus-visible{outline:2px solid #00B4D8;outline-offset:2px}
.chev{color:rgba(255,255,255,.35);font-size:11px}
.kc-body{padding:14px}
.sg{display:grid;gap:8px;margin-bottom:13px}
.sg2{grid-template-columns:repeat(2,1fr)}
.sg3{grid-template-columns:repeat(3,1fr)}
.sg4{grid-template-columns:repeat(4,1fr)}
.sbox{padding:11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);text-align:center}
.sval{font-size:20px;font-weight:700;font-family:'Rajdhani',sans-serif;margin-bottom:2px}
.slbl{font-size:9px;color:rgba(255,255,255,.46)}
.cr{display:grid;gap:10px;margin-bottom:13px}
.cr2{grid-template-columns:1fr 1fr}
.cr3{grid-template-columns:2fr 1fr}
.cbox{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:11px;padding:11px}
.clbl{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.42);margin-bottom:9px;letter-spacing:.07em}
.pbar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:3px 0}
.pfill{height:100%;border-radius:99px;transition:width .5s ease}
.srch-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.srch{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.7);border-radius:7px;padding:5px 9px;font-size:10px;outline:none;width:165px;font-family:inherit}
.srch:focus{border-color:#00B4D8}
.rec-cnt{font-size:8.5px;color:rgba(255,255,255,.3)}
.twrap{overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.07)}
.dt{width:100%;font-size:9.5px;border-collapse:collapse;min-width:460px}
.dt th{padding:7px 10px;text-align:left;font-weight:600;color:#00B4D8;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(0,180,216,.065);white-space:nowrap}
.dt td{padding:6.5px 10px;border-bottom:1px solid rgba(255,255,255,.038);color:rgba(255,255,255,.72);white-space:nowrap}
.dt tr:hover td{background:rgba(255,255,255,.033)}
.pages{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pg{padding:3px 9px;border-radius:5px;border:none;cursor:pointer;font-size:9px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.52);transition:all .12s;font-family:inherit}
.pg:hover{background:rgba(0,180,216,.18);color:#00B4D8}
.pg.act{background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff}
.pg:disabled{opacity:.28;cursor:not-allowed}
.badge{padding:2px 7px;border-radius:99px;font-size:8.5px;display:inline-block;font-weight:500}
.bg{background:rgba(74,222,128,.13);color:#4ADE80}
.by{background:rgba(255,215,0,.13);color:#FFD700}
.br{background:rgba(248,113,113,.13);color:#F87171}
.bb{background:rgba(0,180,216,.13);color:#00B4D8}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(7px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#0c1d38;border-radius:18px;border:1px solid rgba(0,180,216,.22);width:100%;max-width:500px;max-height:90vh;overflow:hidden;box-shadow:0 28px 60px rgba(0,0,0,.65)}
.m-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(0,180,216,.04)}
.m-hdr p{font-size:13px;font-weight:600;font-family:'Rajdhani',sans-serif}
.m-close{background:none;border:none;color:rgba(255,255,255,.42);cursor:pointer;font-size:19px;line-height:1;padding:2px 6px;border-radius:5px}
.m-close:hover{background:rgba(255,255,255,.08);color:#fff}
.m-body{padding:14px;overflow-y:auto;max-height:calc(90vh - 108px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfield{display:flex;flex-direction:column;gap:4px}
.mfield.full{grid-column:1/-1}
.mfield label{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.06em}
.mfield input,.mfield select{padding:8px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:8px;color:#fff;font-size:11px;outline:none;transition:border-color .16s;font-family:inherit}
.mfield input:focus,.mfield select:focus{border-color:#00B4D8}
.m-ftr{display:flex;justify-content:flex-end;gap:7px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.055)}
.btn-c{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:none;color:rgba(255,255,255,.48);font-size:11px;cursor:pointer;transition:all .13s;font-family:inherit}
.btn-c:hover{background:rgba(255,255,255,.07)}
.btn-s{padding:7px 17px;border-radius:8px;border:none;background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 3px 12px rgba(0,180,216,.28);transition:all .13s;font-family:inherit}
.btn-s:hover{transform:scale(1.04)}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ins-card{padding:11px;border-radius:11px;display:flex;align-items:flex-start;gap:9px}
.ins-ico{width:27px;min-width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.ins-ttl{font-size:10px;font-weight:600;margin-bottom:3px}
.ins-txt{font-size:9px;color:rgba(255,255,255,.5);line-height:1.55}
.sp-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);margin-bottom:5px}
.sp-rnk{width:24px;height:24px;min-width:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.atabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.atab{padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.48);font-size:9.5px;font-weight:500;cursor:pointer;transition:all .13s;font-family:inherit}
.atab.act{background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff;border-color:transparent}
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0A1628 0%,#0d2040 45%,#060e1c 100%);position:relative;overflow:hidden}
.l-glow1{position:absolute;top:-80px;left:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(0,180,216,.16) 0%,transparent 70%);pointer-events:none}
.l-glow2{position:absolute;bottom:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.09) 0%,transparent 70%);pointer-events:none}
.l-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,180,216,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,216,.022) 1px,transparent 1px);background-size:54px 54px;pointer-events:none}
.login-card{width:100%;max-width:385px;padding:26px;border-radius:21px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(22px);box-shadow:0 26px 55px rgba(0,0,0,.55);position:relative;z-index:2}
.l-logo{text-align:center;margin-bottom:20px}
.l-badge{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,rgba(0,180,216,.2),rgba(0,180,216,.05));border:1px solid rgba(0,180,216,.28);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;color:#00B4D8}
.l-logo h1{font-family:'Rajdhani',sans-serif;font-size:25px;font-weight:700;letter-spacing:.05em}
.l-logo p{font-size:10.5px;color:rgba(255,255,255,.38);margin-top:2px}
.vo-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:12px;border:1px solid rgba(255,215,0,.36);background:rgba(255,215,0,.08);cursor:pointer;margin-bottom:12px;transition:all .17s;color:inherit;font-family:inherit}
.vo-btn:hover{transform:scale(1.015);background:rgba(255,215,0,.13)}
.vo-btn-txt{font-size:11px;font-weight:600;color:#FFD700}
.ltab-bar{display:flex;border-radius:11px;padding:3px;margin-bottom:17px;background:rgba(0,0,0,.26)}
.ltab{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-size:10.5px;font-weight:500;transition:all .16s;font-family:inherit}
.ltab.act{background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff}
.ltab:not(.act){background:transparent;color:rgba(255,255,255,.4)}
.flbl{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.48);margin-bottom:4px;display:block;letter-spacing:.05em}
.fwrap{position:relative;margin-bottom:12px}
.fico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.linput{width:100%;padding:10px 12px 10px 32px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;outline:none;transition:border-color .16s;font-family:inherit}
.linput:focus{border-color:#00B4D8}
.lbtn{width:100%;padding:11px;border-radius:11px;border:none;background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(0,180,216,.33);transition:all .18s;font-family:inherit}
.lbtn:hover{transform:scale(1.02)}
.lerr{padding:8px 11px;border-radius:8px;background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.26);color:#FCA5A5;font-size:9.5px;margin-bottom:10px}
.demo-tip{padding:7px 11px;border-radius:8px;background:rgba(0,180,216,.09);color:rgba(0,180,216,.78);font-size:9px;margin-bottom:12px;line-height:1.55}
.otp-row{display:flex;gap:7px;justify-content:center;margin-bottom:12px}
.obox{width:40px;height:46px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(0,180,216,.3);color:#fff;font-size:18px;font-weight:700;text-align:center;outline:none;font-family:inherit}
.obox:focus{border-color:#00B4D8}
.empty{text-align:center;padding:20px;color:rgba(255,255,255,.26);font-size:11px;border:1px dashed rgba(255,255,255,.09);border-radius:9px}
.gauge-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.gauge-label{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.row-act{display:flex;gap:4px;align-items:center}
.act-btn{width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .12s;flex-shrink:0}
.act-edit{background:rgba(0,180,216,.12);color:#00B4D8}
.act-edit:hover{background:rgba(0,180,216,.28)}
.act-del{background:rgba(248,113,113,.12);color:#F87171}
.act-del:hover{background:rgba(248,113,113,.28)}
.btn-del{padding:7px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#F87171,#dc2626);color:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:all .13s;font-family:inherit}
.btn-del:hover{transform:scale(1.04)}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:500;pointer-events:none}
.toast-msg{padding:10px 16px;border-radius:10px;background:rgba(10,22,40,.96);border:1px solid rgba(0,180,216,.38);color:#fff;font-size:11.5px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.45);animation:slideInRight .28s ease;max-width:280px;margin-bottom:6px}
.ie-input{background:rgba(255,255,255,.07);border:1px solid rgba(0,180,216,.35);border-radius:6px;color:#fff;font-size:9.5px;padding:3px 7px;outline:none;width:70px;font-family:inherit}
.ie-input:focus{border-color:#00B4D8}
.ie-save{padding:3px 9px;border-radius:5px;border:none;background:linear-gradient(135deg,#00B4D8,#0096C7);color:#fff;font-size:8.5px;font-weight:600;cursor:pointer;font-family:inherit}
.print-btn{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-size:9px;font-weight:500;cursor:pointer;transition:all .13s;font-family:inherit;white-space:nowrap}
.print-btn:hover{background:rgba(255,255,255,.1);color:#fff}

.mgmt-item{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px;font-size:9.5px;line-height:1.45;color:rgba(255,255,255,.7)}
.mgmt-item-dot{width:6px;height:6px;min-width:6px;border-radius:50%;margin-top:4px;flex-shrink:0}

.cmp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}

.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}

.cmp-card-title{font-size:11px;font-weight:700;font-family:'Rajdhani',sans-serif;margin-bottom:10px;letter-spacing:.04em}

.cmp-winner.tie{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.admin-badge{font-size:8.5px;padding:2px 8px;border-radius:99px;background:rgba(255,215,0,.12);color:#FFD700;border:1px solid rgba(255,215,0,.25);font-weight:600}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  const pts=data.map((d,i)=>({x:pl+i*(chartW/(Math.max(data.length-1,1))),y:pt+chartH*(1-(d.v/maxV))}));

    const sweep=((d.v||0)/total)*2*Math.PI,x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle),x2=cx+r*Math.cos(startAngle+sweep),y2=cy+r*Math.sin(startAngle+sweep),large=sweep>Math.PI?1:0;

    const mid=startAngle+sweep/2,lx=cx+(r*0.65)*Math.cos(mid),ly=cy+(r*0.65)*Math.sin(mid),pct=Math.round((d.v||0)/total*100);
    startAngle+=sweep+0.015;return{...d,path,lx,ly,pct};

function Gauge({pct,color,size=100,label}){
  const r=38,circ=2*Math.PI*r,dash=Math.min(pct/100,1)*circ,c=color||(pct>=80?'#4ADE80':pct>=60?'#FFD700':'#F87171');
  return h('div',{className:'gauge-wrap',style:{width:size,height:size}},
    h('svg',{viewBox:'0 0 100 100',width:size,height:size},
      h('circle',{cx:50,cy:50,r,fill:'none',stroke:'rgba(255,255,255,.07)',strokeWidth:9}),
      h('circle',{cx:50,cy:50,r,fill:'none',stroke:c,strokeWidth:9,strokeDasharray:`${dash} ${circ}`,strokeLinecap:'round',style:{transformOrigin:'center',transform:'rotate(-90deg)',transition:'stroke-dasharray .6s'}})),

      label&&h('span',{style:{fontSize:8,color:'rgba(255,255,255,.38)',marginTop:1}},label))

}

// ═══ RETRY LOGIC ══════════════════════════════════════════════
async function retryOp(fn,attempts=3,delayMs=500){
  for(let i=0;i<attempts;i++){
    try{return await fn();}
    catch(e){
      if(i===attempts-1)throw e;
      await new Promise(r=>setTimeout(r,delayMs*Math.pow(2,i)));
    }
  }
}

// ═══ FIRESTORE DATA SERVICE ══════════════════════════════════
function subscribeKpiData(ecIds,onData){
  const{db,collection,onSnapshot,query,limit,orderBy}=window._fb;
  const col=collection(db,KPI_COLLECTION);
  // Limit to 500 most-recent records to prevent excessive reads
  const q=window._fb.query?window._fb.query(col,window._fb.limit(500)):col;
  return onSnapshot(q,snap=>{
    const rows=[];
    snap.forEach(d=>{const data=d.data();if(ecIds.includes(data.ecId))rows.push({id:d.id,...data});});
    onData(rows);
  },err=>console.error('Firestore KPI error:',err));
}
function subscribePlanData(ecIds,onData){
  const{db,collection,onSnapshot}=window._fb;
  const col=collection(db,PLAN_COLLECTION);
  return onSnapshot(col,snap=>{
    const rows=[];
    snap.forEach(d=>{const data=d.data();if(ecIds.includes(data.ecId))rows.push({id:d.id,...data});});
    onData(rows);
  },err=>console.error('Firestore Plan error:',err));
}
async function fsAdd(colName,data){
  return retryOp(()=>{const{db,collection,addDoc,serverTimestamp}=window._fb;return addDoc(collection(db,colName),{...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});});
}
async function fsUpdate(colName,id,data){
  return retryOp(()=>{const{db,doc,updateDoc,serverTimestamp}=window._fb;return updateDoc(doc(db,colName,id),{...data,updatedAt:serverTimestamp()});});
}
async function fsDelete(colName,id){
  return retryOp(()=>{const{db,doc,deleteDoc}=window._fb;return deleteDoc(doc(db,colName,id));});
}
async function fsCount(colName){const{db,collection,getDocs}=window._fb;const snap=await getDocs(collection(db,colName));return snap.size;}

function downloadCSV(rows,cols,filename){
  if(!rows||!rows.length)return;
  const header=cols.map(c=>JSON.stringify(c.l||c.k||'')).join(',');
  const lines=rows.map(row=>cols.map(c=>JSON.stringify(String(row[c.k]!==undefined?row[c.k]:''))).join(','));
  const csv=[header,...lines].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=(filename||'export')+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

// Centralized thresholds
const THR={
  misComp:{crit:70,warn:90},csat:{crit:3.5,warn:4.2},sat:{crit:50,warn:75},
  audit:{crit:70,warn:85},showroom:{crit:6,warn:8},planAvg:{crit:70,warn:90},

};

// Freshness: returns {label, cls, days} from array of rows
function computeFreshness(rows,field='date'){
  if(!rows||!rows.length)return{label:'No data',cls:'fresh-n',days:999};
  const dates=rows.map(r=>r[field]||'').filter(Boolean).sort();
  const latest=dates[dates.length-1];
  if(!latest)return{label:'No data',cls:'fresh-n',days:999};
  const days=Math.floor((Date.now()-new Date(latest).getTime())/(864e5));
  if(isNaN(days))return{label:'No data',cls:'fresh-n',days:999};
  if(days===0)return{label:'Today',cls:'fresh-g',days:0};
  if(days<=2)return{label:days+'d ago',cls:'fresh-g',days};
  if(days<=7)return{label:days+'d ago',cls:'fresh-y',days};
  if(days<=30)return{label:days+'d ago',cls:'fresh-r',days};
  return{label:Math.floor(days/30)+'mo ago',cls:'fresh-r',days};
}

// Action center: classify all KPI data into critical / watchlist / wins
function computeActionCenter(allData,prevStats){
  const critical=[],watchlist=[],wins=[];
  const {leads=[],datamgmt=[],custFb=[],archFb=[],audits=[],showroom=[],expenses=[],skills=[],footfall=[],archs=[],salesPlans=[]}=allData;

  const dmOT=datamgmt.filter(r=>r.status==='On Time').length;
  const dmc=datamgmt.length?Math.round(dmOT/datamgmt.length*100):null;
  if(dmc!==null){
    if(dmc<THR.misComp.crit)critical.push({ico:'\u26a0\ufe0f',lbl:'MIS Compliance',val:dmc+'%',txt:`Only ${dmOT}/${datamgmt.length} reports on time. Review submission discipline.`});
    else if(dmc<THR.misComp.warn)watchlist.push({ico:'\ud83d\udcca',lbl:'MIS Compliance',val:dmc+'%',txt:'Compliance is acceptable but can improve to 90%+.'});
    else wins.push({ico:'\u2705',lbl:'MIS Compliance',val:dmc+'%',txt:'Reports are being submitted on time consistently.'});
  }

  // CSAT
  const cfA=custFb.length?custFb.reduce((a,f)=>a+(f.rating||0),0)/custFb.length:null;
  if(cfA!==null){
    if(cfA<THR.csat.crit)critical.push({ico:'\ud83d\udcac',lbl:'Customer CSAT',val:'\u2605'+cfA.toFixed(1),txt:`${custFb.length} responses averaging below 3.5. Address response time and solution quality.`});
    else if(cfA<THR.csat.warn)watchlist.push({ico:'\ud83d\udcac',lbl:'Customer CSAT',val:'\u2605'+cfA.toFixed(1),txt:'CSAT is acceptable. Target 4.2+ by improving staff responsiveness.'});
    else wins.push({ico:'\u2705',lbl:'Customer CSAT',val:'\u2605'+cfA.toFixed(1),txt:`Customers are highly satisfied across ${custFb.length} responses.`});
  }

  // Architect Sat
  const afA=archFb.length?archFb.reduce((a,f)=>a+(f.rating||0),0)/archFb.length:null;
  if(afA!==null){
    const satV=Math.round(afA*20);
    if(satV<THR.sat.crit)watchlist.push({ico:'\u2b50',lbl:'Architect Sat.',val:satV,txt:'Architect satisfaction needs improvement. Focus on hospitality and product demos.'});
    else if(satV>=THR.sat.warn)wins.push({ico:'\u2b50',lbl:'Architect Sat.',val:satV,txt:'Architects are highly engaged. Leverage for referral campaigns.'});
  }

  // Audit
  const auSc=audits.reduce((a,s)=>a+(s.score||0),0),auMx=audits.reduce((a,s)=>a+(s.maxScore||0),0);
  if(auMx>0){
    const auP=Math.round(auSc/auMx*100);

    else if(auP<THR.audit.warn)watchlist.push({ico:'\ud83c\udfaf',lbl:'Audit Score',val:auP+'%',txt:'Audit score is passing. Address remaining parameter gaps before next audit.'});
    else wins.push({ico:'\u2705',lbl:'Audit Score',val:auP+'%',txt:'Audit compliance is strong and above threshold.'});
  }

  // Showroom
  const swA=showroom.length?showroom.reduce((a,s)=>a+(s.score||0),0)/showroom.length:null;
  if(swA!==null){
    if(swA<THR.showroom.crit)critical.push({ico:'\ud83c\udfe2',lbl:'Showroom Score',val:swA.toFixed(1)+'/10',txt:'Showroom upkeep is below standard. Immediate attention to cleanliness and display.'});
    else if(swA<THR.showroom.warn)watchlist.push({ico:'\ud83c\udfe2',lbl:'Showroom Score',val:swA.toFixed(1)+'/10',txt:'Showroom is acceptable but not excellent. Target 8+.'});
    else wins.push({ico:'\u2705',lbl:'Showroom Score',val:swA.toFixed(1)+'/10',txt:'Showroom is well-maintained and above target.'});
  }

  // Lead conversion
  const conv=leads.filter(l=>l.convertedToVisit).length;
  const lcr=leads.length?Math.round(conv/leads.length*100):null;
  if(lcr!==null){
    if(lcr<THR.leadConv.crit)critical.push({ico:'\ud83d\udcc9',lbl:'Lead Conversion',val:lcr+'%',txt:`Only ${conv}/${leads.length} leads converted. Review follow-up process urgently.`});
    else if(lcr>=THR.leadConv.warn)wins.push({ico:'\ud83d\udcc8',lbl:'Lead Conversion',val:lcr+'%',txt:'Lead-to-visit conversion is exceeding the 40% target.'});
    else watchlist.push({ico:'\ud83d\udcc8',lbl:'Lead Conversion',val:lcr+'%',txt:'Conversion is in range but has room for growth. Improve follow-up cadence.'});
  }

  // Expenses
  const tb=expenses.reduce((a,e)=>a+(e.budgetAmount||0),0),ta=expenses.reduce((a,e)=>a+(e.actualAmount||0),0);
  if(tb>0){
    const ep=Math.round(ta/tb*100);
    if(ep>THR.expPct.crit)critical.push({ico:'\ud83d\udcb0',lbl:'Expenses',val:ep+'% of budget',txt:'Spending is over budget. Review categories and enforce approval controls.'});
    else if(ep>THR.expPct.warn)watchlist.push({ico:'\ud83d\udcb0',lbl:'Expenses',val:ep+'% of budget',txt:'Spending is approaching budget ceiling. Monitor closely.'});
  }

  // Sales plans
  if(salesPlans.length>0){
    const spRnk=salesPlans.map(p=>({n:p.salespersonName,avg:p.lines&&p.lines.length?Math.round(p.lines.reduce((a,l)=>a+(l.achievementPct||0),0)/p.lines.length):0}));
    const bottom=spRnk.filter(s=>s.avg<THR.planAvg.crit);
    const top=spRnk.filter(s=>s.avg>=90);
    if(bottom.length>0)watchlist.push({ico:'\ud83d\udcc5',lbl:'Plan Achievement',val:bottom.length+' below 70%',txt:bottom.map(s=>s.n.split(' ')[0]).join(', ')+' need coaching support.'});

    if(chg>10)wins.push({ico:'\ud83d\udc65',lbl:'Footfall Growth',val:'+'+chg+'% vs prev',txt:`Footfall improved by ${chg}% compared to the previous equivalent period.`});

  }

  return{critical:critical.slice(0,4),watchlist:watchlist.slice(0,4),wins:wins.slice(0,4)};
}

// Drill-down insight object for a specific KPI
function kpiDrillDown(type,data){
  if(!data||!data.length)return{title:'No Data',sections:[{lbl:'Status',val:'No data',detail:'No records found in the selected date range.'}]};
  const n=data.length;
  if(type==='leads'){
    const conv=data.filter(l=>l.convertedToVisit).length;
    const cr=n?Math.round(conv/n*100):0;
    const srcMap=data.reduce((a,l)=>{if(!a[l.leadSource])a[l.leadSource]={t:0,c:0};a[l.leadSource].t++;if(l.convertedToVisit)a[l.leadSource].c++;return a},{});
    const srcArr=Object.entries(srcMap).map(([src,v])=>({src,rate:v.t?Math.round(v.c/v.t*100):0}));
    const best=srcArr.sort((a,b)=>b.rate-a.rate)[0];
    const worst=srcArr.sort((a,b)=>a.rate-b.rate)[0];
    return{title:'Lead Conversion Drill-Down',sections:[
      {lbl:'Total Leads',val:n,detail:`${conv} converted to EC visits`},
      {lbl:'Conversion Rate',val:cr+'%',detail:cr>=40?'Above 40% target — keep follow-up discipline':'Below 40% target — review qualification and follow-up'},
      {lbl:'Best Source',val:best?best.src:'—',detail:best?best.rate+'% conversion rate from this source':'—'},
      {lbl:'Weakest Source',val:worst&&worst.src!==best?.src?worst.src:'—',detail:worst&&worst.src!==best?.src?worst.rate+'% — consider reviewing this channel':''},
      {lbl:'Next Action',val:null,detail:cr<30?'Escalate: implement 24h follow-up SLA for all new leads':cr<40?'Improve: coach salespersons on lead qualification criteria':'Maintain: share best practices across team'},
    ]};
  }
  if(type==='datamgmt'){
    const ot=data.filter(r=>r.status==='On Time').length,late=data.filter(r=>r.status==='Late').length,miss=data.filter(r=>r.status==='Missing').length;
    const comp=n?Math.round(ot/n*100):0;
    const typeWorst=['Daily Report','Weekly MIS','Monthly Report'].map(t=>{const it=data.filter(r=>r.reportType===t);return{t,rate:it.length?Math.round(it.filter(r=>r.status==='On Time').length/it.length*100):100};}).sort((a,b)=>a.rate-b.rate)[0];
    return{title:'MIS Compliance Drill-Down',sections:[
      {lbl:'Overall Compliance',val:comp+'%',detail:`${ot} on time, ${late} late, ${miss} missing`},
      {lbl:'Weakest Report Type',val:typeWorst?typeWorst.t:'—',detail:typeWorst?typeWorst.rate+'% on-time rate — needs priority attention':''},
      {lbl:'Late + Missing Count',val:late+miss,detail:'Each late submission creates reporting gaps for management review'},
      {lbl:'Next Action',val:null,detail:comp<70?'Critical: implement mandatory daily sign-off check':comp<90?'Set automated deadline reminders 24h before due date':'Sustain current process — consider recognising top submitters'},
    ]};
  }
  if(type==='custFb'){
    const avgR=n?parseFloat((data.reduce((a,f)=>a+(f.rating||0),0)/n).toFixed(1)):0;
    const neg=data.filter(f=>f.rating<=2).length;
    const paramKeys=['productDisplay','staffBehavior','responseTime','solutionProvided'];
    const paramAvgs=paramKeys.map(k=>{const it=data.filter(f=>f.parameters&&f.parameters[k]);return{k,avg:it.length?it.reduce((a,f)=>a+f.parameters[k],0)/it.length:0};});
    const weakP=paramAvgs.sort((a,b)=>a.avg-b.avg)[0];
    return{title:'Customer CSAT Drill-Down',sections:[
      {lbl:'Average Rating',val:'\u2605'+avgR+'/5',detail:`${n} customer responses collected`},
      {lbl:'Negative Responses',val:neg,detail:neg>0?neg+' customers rated 2 stars or below — follow up required':'No severely negative responses'},
      {lbl:'Weakest Parameter',val:weakP?weakP.k.replace(/([A-Z])/g,' $1').trim():'—',detail:weakP?'Avg '+weakP.avg.toFixed(1)+'/5 — focus training on this area':''},
      {lbl:'Next Action',val:null,detail:avgR<3.5?'Urgent: conduct customer callback campaign for all 1-2 star ratings':avgR<4.2?'Improve: train staff on response time and solution quality':'Recognise team and share positive feedback at next review meeting'},
    ]};
  }
  if(type==='archFb'){

  }
  return{title:'KPI Analysis',sections:[{lbl:'Records',val:n,detail:'Data recorded for selected period'}]};
}

// Linear trend prediction
function computePrediction(monthly,key){
  const vals=monthly.map(m=>m[key]||0);
  const n=vals.length;
  if(n===0)return null;
  if(n===1)return{next:vals[0],trend:'flat',slope:0,conf:'low',n,last:vals[0]};
  const xMean=(n-1)/2,yMean=vals.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){num+=(i-xMean)*(vals[i]-yMean);den+=(i-xMean)**2;}
  const slope=den?num/den:0;
  const intercept=yMean-slope*xMean;
  const next=Math.max(0,Math.round(intercept+slope*n));
  const trend=Math.abs(slope)<0.5?'flat':slope>0?'up':'down';
  const conf=n<3?'low':n<5?'medium':'good';
  return{next,trend,slope:parseFloat(slope.toFixed(1)),conf,n,last:vals[n-1]};
}

// ═══ ERROR BOUNDARY ════════════════════════════════════════════
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  componentDidCatch(e,info){console.error('[ErrorBoundary]',e,info);}
  render(){
    if(this.state.error){
      return React.createElement('div',{className:'err-boundary'},
        React.createElement('div',{style:{fontSize:40,marginBottom:8}},'⚠️'),
        React.createElement('h2',null,'Something went wrong'),
        React.createElement('p',null,'An unexpected error occurred in the dashboard. This is usually caused by a data format issue or a browser compatibility problem.'),
        React.createElement('p',{style:{fontSize:9,color:'rgba(255,255,255,.25)',marginTop:4,fontFamily:'monospace'}},String(this.state.error?.message||'').slice(0,120)),
        React.createElement('button',{className:'btn-s',style:{marginTop:14},onClick:()=>{this.setState({error:null});window.location.reload();}},'🔄 Reload Dashboard')
      );
    }
    return this.props.children;
  }
}

// ═══ VALIDATION HELPERS ═══════════════════════════════════════
function validateField(field,val){
  if(field.req&&(!val||!String(val).trim()))return 'Required field';
  if(field.type==='date'&&val){const d=new Date(val);if(isNaN(d.getTime()))return 'Invalid date';}
  if(field.type==='number'&&val!==''){
    const n=parseFloat(val);
    if(isNaN(n))return 'Must be a number';
    if(field.min!==undefined&&n<field.min)return `Min value is ${field.min}`;
    if(field.max!==undefined&&n>field.max)return `Max value is ${field.max}`;
  }
  return null;
}
function validateForm(fields,form){
  const errs={};
  fields.forEach(f=>{const e=validateField(f,form[f.n]);if(e)errs[f.n]=e;});
  return errs;
}

// ═══ MODAL ════════════════════════════════════════════════════
function Modal({title,fields,onSubmit,onClose,editData}){
  const[form,setForm]=useState(()=>{
    if(editData)return fields.reduce((a,f)=>({...a,[f.n]:editData[f.n]!==undefined?String(editData[f.n]):(f.def||'')}),{});
    return fields.reduce((a,f)=>({...a,[f.n]:f.def||''}),{});
  });
  const[errs,setErrs]=useState({});
  const[submitting,setSubmitting]=useState(false);
  const upd=(k,v)=>{setForm(f=>({...f,[k]:v}));if(errs[k])setErrs(e=>({...e,[k]:null}));};
  useEffect(()=>{document.body.style.overflow='hidden';return()=>{document.body.style.overflow='';};},[]);
  const handleSubmit=()=>{
    if(submitting)return;
    const newErrs=validateForm(fields,form);
    if(Object.keys(newErrs).length>0){setErrs(newErrs);return;}
    setSubmitting(true);
    try{onSubmit(form);}finally{setTimeout(()=>setSubmitting(false),800);}
  };
  return h('div',{className:'mbg',onMouseDown:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'modal'},
      h('div',{className:'m-hdr'},
        h('div',{style:{display:'flex',alignItems:'center',gap:8}},h('span',{style:{fontSize:15}},editData?'\u270f\ufe0f':'\u2795'),h('p',null,editData?'Edit Entry':title)),
        h('button',{className:'m-close','aria-label':'Close',onClick:onClose},'\xd7')
      ),
      h('div',{className:'m-body'},...fields.map(f=>h('div',{key:f.n,className:'mfield'+(f.full?' full':'')},
        h('label',{htmlFor:'mf-'+f.n},f.l+(f.req?' *':'')),
        f.type==='select'
          ?h('select',{id:'mf-'+f.n,className:errs[f.n]?'invalid':'',value:form[f.n],onChange:e=>upd(f.n,e.target.value)},h('option',{value:''},'Select...'),f.opts.map(o=>h('option',{key:o,value:o},o)))
          :h('input',{id:'mf-'+f.n,className:errs[f.n]?'invalid':'',type:f.type||'text',value:form[f.n],onChange:e=>upd(f.n,e.target.value),min:f.min,max:f.max,placeholder:f.ph||''}),
        errs[f.n]&&h('div',{className:'mfield-err'},'\u26a0 ',errs[f.n])
      ))),
      h('div',{className:'m-ftr'},
        h('button',{className:'btn-c',onClick:onClose},'Cancel'),
        h('button',{className:'btn-s',disabled:submitting,style:{opacity:submitting?.6:1},onClick:handleSubmit},submitting?'\u23f3 Saving...':(editData?'\ud83d\udcbe Update':'\ud83d\udcbe Save Entry'))
      )
    )
  );
}

// ═══ useKpiState ══════════════════════════════════════════════
function useKpiState(col,add,upd,del,showToast){
  const[modal,setModal]=useState(false);
  const[editRow,setEditRow]=useState(null);
  const[confirmId,setConfirmId]=useState(null);
  const[confirmLabel,setConfirmLabel]=useState(null);
  const openAdd=()=>{setEditRow(null);setModal(true);};
  const openEdit=row=>{setEditRow(row);setModal(true);};
  const closeModal=()=>{setModal(false);setEditRow(null);};
  const handleSubmit=(raw,transform)=>{
    const processed=transform?transform(raw):raw;
    if(editRow){
      upd(col,editRow.id,processed)
        .then(()=>showToast('\u2705 Entry updated!'))
        .catch(e=>showToast('\u274c Update failed: '+e.message));
    } else {
      add(col,processed)
        .then(()=>showToast('\u2705 Entry saved!'))
        .catch(e=>showToast('\u274c Save failed: '+e.message));
    }
    closeModal();
  };
  const handleDelete=row=>{
    const lbl=row.date?`${row.kpiType||col} \u2014 ${row.date}`:`ID: ${row.id}`;
    setConfirmLabel(lbl);setConfirmId(row.id);
  };
  const confirmDelete=()=>{
    const id=confirmId;
    setConfirmId(null);setConfirmLabel(null);
    del(col,id)
      .then(()=>showToast('\ud83d\uddd1 Entry deleted!'))
      .catch(e=>showToast('\u274c Delete failed: '+e.message));
  };
  return{modal,editRow,confirmId,confirmLabel,openAdd,openEdit,closeModal,handleSubmit,handleDelete,confirmDelete,cancelDelete:()=>{setConfirmId(null);setConfirmLabel(null);}};
}

// ═══ DATA TABLE ═══════════════════════════════════════════════
function DataTable({cols,rows,ps=10,onEdit,onDelete,csvName}){

function ExportAllBtn({allData,dateLabel}){
  const handleExport=()=>{

      {name:'leads',cols:[{k:'date',l:'Date'},{k:'leadSource',l:'Source'},{k:'leadName',l:'Name'},{k:'status',l:'Status'},{k:'convertedToVisit',l:'Converted'},{k:'salesperson',l:'Salesperson'}]},

      {name:'archFb',cols:[{k:'date',l:'Date'},{k:'name',l:'Architect'},{k:'rating',l:'Rating'},{k:'category',l:'Sentiment'},{k:'feedbackText',l:'Feedback'}]},
      {name:'expenses',cols:[{k:'date',l:'Date'},{k:'category',l:'Category'},{k:'budgetAmount',l:'Budget'},{k:'actualAmount',l:'Actual'},{k:'variance',l:'Variance'}]},
      {name:'audits',cols:[{k:'date',l:'Date'},{k:'parameter',l:'Parameter'},{k:'score',l:'Score'},{k:'maxScore',l:'Max'},{k:'findings',l:'Findings'}]},
      {name:'custFb',cols:[{k:'date',l:'Date'},{k:'name',l:'Customer'},{k:'rating',l:'Rating'},{k:'feedbackText',l:'Feedback'}]},
    ];
    let combined='AIS Windows EC-KPI Export\nDate Range: '+dateLabel+'\nGenerated: '+new Date().toLocaleDateString('en-IN')+'\n\n';
    sections.forEach(s=>{
      const rows=allData[s.name]||[];
      if(!rows.length)return;
      combined+='=== '+s.name.toUpperCase()+' ('+rows.length+' records) ===\n';
      combined+=s.cols.map(c=>c.l).join(',')+'\n';

      combined+='\n\n';

    const a=document.createElement('a');
    a.href=url;a.download='AIS_EC_KPI_Export_'+dateLabel.replace(/\s/g,'_')+'.csv';a.click();

function PredictiveTab({monthly}){
  if(!monthly||monthly.length===0)return h('div',{className:'empty'},'No historical data available yet for the selected filter. Record data across multiple months to enable forecasting.');
  const metrics=[
    {key:'ff',label:'Footfall',color:'#00B4D8',unit:'',fmt:v=>String(v)},
    {key:'leads',label:'Online Leads',color:'#4ADE80',unit:'',fmt:v=>String(v)},
    {key:'audit',label:'Audit Score',color:'#A78BFA',unit:'%',fmt:v=>v+'%'},
    {key:'sat',label:'Architect Sat.',color:'#FFD700',unit:'',fmt:v=>String(v)},
  ];
  const trendIco=t=>t==='up'?'\u2197\ufe0f':t==='down'?'\u2198\ufe0f':'\u27a1\ufe0f';
  const confLabel=c=>c==='good'?'Good confidence':c==='medium'?'Medium confidence':'Low confidence (need 3+ months)';
  const confColor=c=>c==='good'?'#4ADE80':c==='medium'?'#FFD700':'rgba(255,255,255,.35)';
  const sentence=(m,pred)=>{
    if(!pred)return'Insufficient data.';
    const dir=pred.trend==='up'?'increase to':'trend down to about';
    const flat='remain around';
    const word=pred.trend==='flat'?flat:dir;
    return`If current trend continues, ${m.label} may ${word} ${m.fmt(pred.next)} next period.`;
  };
  return h('div',null,
    h('div',{style:{padding:'9px 12px',borderRadius:10,background:'rgba(0,180,216,.06)',border:'1px solid rgba(0,180,216,.18)',marginBottom:12,fontSize:9.5,color:'rgba(255,255,255,.6)',lineHeight:1.6}},
      '\ud83d\udd2e Forecasts use linear trend projection from '+monthly.length+' months of live data. More data improves confidence. Gold = predicted next period value.'
    ),
    h('div',{className:'pred-grid'},
      metrics.map(m=>{
        const pred=computePrediction(monthly,m.key);
        if(!pred)return null;
        const tc=pred.trend==='up'?'#4ADE80':pred.trend==='down'?'#F87171':'rgba(255,255,255,.5)';
        return h('div',{key:m.key,className:'pred-card'},
          h('div',{className:'pred-card-lbl'},m.label.toUpperCase()),
          h('div',{style:{display:'flex',alignItems:'flex-end',gap:10,marginBottom:4}},
            h('div',null,
              h('div',{style:{fontSize:9,color:'rgba(255,255,255,.38)',marginBottom:2}},'CURRENT'),
              h('div',{className:'pred-next',style:{color:m.color,fontSize:20}},m.fmt(pred.last))
            ),
            h('div',{style:{fontSize:18,color:'rgba(255,255,255,.2)',marginBottom:4}},'\u2192'),
            h('div',null,
              h('div',{style:{fontSize:9,color:'rgba(255,215,0,.7)',marginBottom:2}},'FORECAST'),
              h('div',{className:'pred-next',style:{color:'#FFD700'}},m.fmt(pred.next))
            )
          ),
          h('div',{className:'pred-trend',style:{color:tc}},trendIco(pred.trend)+' '+pred.trend.charAt(0).toUpperCase()+pred.trend.slice(1)+(pred.slope!==0?' ('+pred.slope+'/mo)':'')),
          h('div',{className:'pred-conf',style:{color:confColor(pred.conf)}},'\u25a0 '+confLabel(pred.conf)+' \u00b7 '+pred.n+' data points'),
          h('div',{className:'pred-sentence'},sentence(m,pred))
        );
      })
    ),
    monthly.length>=2&&h('div',{className:'cr cr2'},
      h('div',{className:'cbox'},h('div',{className:'clbl'},'FOOTFALL TREND + FORECAST'),
        h(BarChart,{data:[...monthly,{label:'Next\u2192',ff:computePrediction(monthly,'ff')?.next||0,_pred:true}],keys:['ff'],colors:[...(monthly.map(()=>'#00B4D8')),'#FFD700'],height:160})
      ),
      h('div',{className:'cbox'},h('div',{className:'clbl'},'LEADS TREND + FORECAST'),
        h(BarChart,{data:[...monthly,{label:'Next\u2192',leads:computePrediction(monthly,'leads')?.next||0}],keys:['leads'],colors:[...(monthly.map(()=>'#4ADE80')),'#FFD700'],height:160})
      )
    )
  );
}

        h('div',{className:'fwrap'},h('span',{className:'fico'},'\ud83d\udce7'),h('input',{id:'otemail',className:'linput',type:'email',value:email,onChange:e=>setEmail(e.target.value),placeholder:'name@aisglass.com'})),
        h('div',{style:{fontSize:9.5,color:'rgba(255,255,255,.42)',textAlign:'center',marginBottom:10}},'OTP login is configured by your Firebase Admin.'),
        h('div',{className:'otp-row'},otp.map((_,i)=>h('input',{key:i,id:'otp'+i,className:'obox',maxLength:1,value:otp[i],onChange:otpRef(i)}))),
        h('button',{className:'lbtn'},'\ud83d\udcf1 Verify OTP')
      )
    )
  );
}

// ═══ EC TAB BAR ═══════════════════════════════════════════════
function ECTabBar({ecs,current,onChange}){
  if(!ecs||ecs.length<=1)return null;
  const tabs=[...ecs,'combined'];
  return h('div',{style:{display:'flex',gap:5,marginBottom:13,padding:'4px',borderRadius:11,background:'rgba(0,0,0,.22)',width:'fit-content'}},
    tabs.map(ec=>h('button',{key:ec,onClick:()=>onChange(ec),
      style:{padding:'7px 16px',borderRadius:8,border:'none',cursor:'pointer',fontSize:10,fontWeight:500,transition:'all .16s',fontFamily:'inherit',
        background:current===ec?'linear-gradient(135deg,#00B4D8,#0096C7)':'transparent',
        color:current===ec?'#fff':'rgba(255,255,255,.45)'}},
      ec==='combined'?'\ud83d\udcca Combined View':(EC_LABELS[ec]||ec)
    ))
  );
}

// ═══ NAV CONFIG ══════════════════════════════════════════════
const NAV=[
  {id:'dashboard',ico:'\ud83d\udd35',lbl:'Dashboard',sub:'Overview'},
  {id:'kpi1',ico:'\ud83d\udcca',lbl:'Online Leads',sub:'KPI 1'},
  {id:'kpi2',ico:'\ud83c\udfd7',lbl:'Architect Visits',sub:'KPI 2'},
  {id:'kpi3',ico:'\ud83d\udc65',lbl:'Footfall',sub:'KPI 3'},
  {id:'kpi4',ico:'\ud83c\udfe2',lbl:'Showroom',sub:'KPI 4'},
  {id:'kpi5',ico:'\ud83d\udcca',lbl:'MIS & Data Mgmt',sub:'KPI 5'},
  {id:'kpi6',ico:'\ud83d\udcda',lbl:'Skills',sub:'KPI 6'},
  {id:'kpi7',ico:'\u2b50',lbl:'Arch Feedback',sub:'KPI 7'},
  {id:'kpi8',ico:'\ud83d\udcb0',lbl:'Expenses',sub:'KPI 8'},
  {id:'kpi9',ico:'\ud83c\udfaf',lbl:'Audit',sub:'KPI 9'},
  {id:'kpi10',ico:'\ud83d\udcc8',lbl:'Sales Plans',sub:'KPI 10'},
  {id:'kpi11',ico:'\ud83d\udcac',lbl:'Customer Feedback',sub:'KPI 11'},
  {id:'analytics',ico:'\ud83e\udde0',lbl:'Analytics',sub:'Insights'},
];
const TITLES={
  dashboard:'Dashboard',kpi1:'Online Lead Conversion',kpi2:'Architect Invitations',kpi3:'Customer Footfall',
  kpi4:'Showroom Upkeep',kpi5:'Data Management',kpi6:'Presentation Skills',kpi7:'Architect Feedback',
  kpi8:'Expense Management',kpi9:'Audit Score',kpi10:'Sales Plans',kpi11:'Customer Feedback',
  analytics:'Analytics & Insights',compare:'EC Comparison'
};

// Date range dict
const DR={
  'Oct 25':{s:'2025-10-01',e:'2025-10-31'},
  'Nov 25':{s:'2025-11-01',e:'2025-11-30'},
  'Dec 25':{s:'2025-12-01',e:'2025-12-31'},
  'Q4 FY25':{s:'2025-10-01',e:'2025-12-31'},
  'Jan 26':{s:'2026-01-01',e:'2026-01-31'},
  'Feb 26':{s:'2026-02-01',e:'2026-02-28'},
  'Mar 26':{s:'2026-03-01',e:'2026-03-31'},
  'Apr 26':{s:'2026-04-01',e:'2026-04-30'},
  'May 26':{s:'2026-05-01',e:'2026-05-31'},
  'Jun 26':{s:'2026-06-01',e:'2026-06-30'},
  'Q1 FY26':{s:'2026-01-01',e:'2026-03-31'},
  'Q2 FY26':{s:'2026-04-01',e:'2026-06-30'},
  'YTD 26':{s:'2026-01-01',e:new Date().toISOString().slice(0,10)},
};

// ═══ APP (MAIN COMPONENT) ═════════════════════════════════════
function App(){
  const[fbReady,setFbReady]=useState(!!window._fbReady);
  const[authUser,setAuthUser]=useState(null);
  const[viewerMode,setViewerMode]=useState(false);
  const[page,setPage]=useState('dashboard');
  const[slim,setSlim]=useState(false);
  const[selDate,setSelDate]=useState('May 26');
  const[customFrom,setCustomFrom]=useState('');
  const[customTo,setCustomTo]=useState('');
  const[showDatePop,setShowDatePop]=useState(false);
  const[rawKpi,setRawKpi]=useState([]);
  const[rawPlans,setRawPlans]=useState([]);
  const[toast,setToast]=useState('');
  const[currentEc,setCurrentEc]=useState('combined');
  const[exceptionFilter,setExceptionFilter]=useState('all');
  const[notes,setNotes]=useState([]);
  const[isOnline,setIsOnline]=useState(navigator.onLine);
  const[dataLoading,setDataLoading]=useState(true);
  const[lastSync,setLastSync]=useState(null);
  const showToast=msg=>setToast(msg);

  useEffect(()=>{
    if(window._fbReady){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener('fbReady',h);
    return()=>window.removeEventListener('fbReady',h);
  },[]);

  useEffect(()=>{
    if(!fbReady)return;
    const{auth,onAuthStateChanged}=window._fb;
    return onAuthStateChanged(auth,u=>setAuthUser(u));
  },[fbReady]);

  // Online / offline detection
  useEffect(()=>{
    const goOnline=()=>setIsOnline(true);
    const goOffline=()=>setIsOnline(false);
    window.addEventListener('online',goOnline);
    window.addEventListener('offline',goOffline);
    return()=>{window.removeEventListener('online',goOnline);window.removeEventListener('offline',goOffline);};
  },[]);

  // Keyboard shortcuts: Ctrl+P = print, Esc = close modals/exception
  useEffect(()=>{
    const handler=e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='p'){e.preventDefault();window.print();}
      if(e.key==='Escape'){setShowDatePop(false);setExceptionFilter('all');}
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[]);

  const userConfig=useMemo(()=>authUser?getUserConfig(authUser.email):null,[authUser]);

  // Initialize EC tab for manager
  useEffect(()=>{
    if(userConfig&&userConfig.ecs.length===1)setCurrentEc(userConfig.ecs[0]);
  },[userConfig]);

  // Subscribe to Firestore — track loading and last-sync timestamp
  useEffect(()=>{
    if(!fbReady||(!authUser&&!viewerMode))return;
    const ecIds=userConfig?.ecs||['bangalore','delhi'];
    let loaded1=false,loaded2=false;
    const tryDoneLoading=()=>{if(loaded1&&loaded2){setDataLoading(false);setLastSync(new Date());}};
    const u1=subscribeKpiData(ecIds,rows=>{setRawKpi(rows);loaded1=true;tryDoneLoading();setLastSync(new Date());});
    const u2=subscribePlanData(ecIds,rows=>{setRawPlans(rows);loaded2=true;tryDoneLoading();});
    if(authUser&&userConfig?.role==='Admin')checkAndSeedIfEmpty(authUser.email);
    const u3=window._fb.onSnapshot(window._fb.collection(window._fb.db,NOTES_COLLECTION),snap=>{const rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));setNotes(rows);},()=>{});
    return()=>{u1&&u1();u2&&u2();u3&&u3();};
  },[fbReady,authUser,viewerMode,userConfig]);

  // Date filter function
  const fdate=useCallback((items,field='date')=>{
    let s,e;
    if(selDate==='Custom'){s=customFrom;e=customTo;if(!s||!e)return items;}
    else{const r=DR[selDate];if(!r)return items;s=r.s;e=r.e;}
    return items.filter(i=>(i[field]||'')>=s&&(i[field]||'')<=e);
  },[selDate,customFrom,customTo]);

  // Active date label
  const activeDateLabel=selDate==='Custom'&&customFrom&&customTo?customFrom+' \u2192 '+customTo:selDate;

  // Filter KPI rows by current EC
  const ecFilter=useCallback(rows=>{
    if(currentEc==='combined')return rows;
    return rows.filter(r=>r.ecId===currentEc);
  },[currentEc]);

  // Filtered data helpers
  const byType=useCallback((type,field)=>{
    const ec=ecFilter(rawKpi.filter(r=>r.kpiType===type));
    return fdate(ec,field||'date');
  },[rawKpi,ecFilter,fdate]);

  const fL=byType('leads'),fA=byType('archs'),fFF=byType('footfall'),fSW=byType('showroom');
  const fDM=byType('datamgmt','dueDate'),fSk=byType('skills'),fAF=byType('archFb'),fEx=byType('expenses');
  const fAu=byType('audits');
  const fCF=byType('custFb');
  const fPlans=ecFilter(rawPlans);

  // Stats for overview cards
  const stats=useMemo(()=>{
    const conv=fL.filter(l=>l.convertedToVisit).length;
    const afAvg=fAF.length?fAF.reduce((a,f)=>a+f.rating,0)/fAF.length:0;
    const auSc=fAu.reduce((a,s)=>a+s.score,0),auMx=fAu.reduce((a,s)=>a+s.maxScore,0);
    const swAvg=fSW.length?fSW.reduce((a,s)=>a+s.score,0)/fSW.length:0;
    return{footfall:fFF.length,convRate:fL.length?Math.round(conv/fL.length*100):0,sat:Math.round(afAvg*20),audit:auMx?Math.round(auSc/auMx*100):0,showroom:parseFloat(swAvg.toFixed(1)),leads:fL.length};
  },[fL,fFF,fAF,fAu,fSW]);

  // prevStats — same calculation over the previous equivalent period for trend arrows
  const prevStats=useMemo(()=>{
    let ps,pe;
    if(selDate==='Custom'&&customFrom&&customTo){
      const len=new Date(customTo)-new Date(customFrom);
      pe=new Date(new Date(customFrom).getTime()-1);
      ps=new Date(pe.getTime()-len);
    } else {
      const r=DR[selDate];
      if(!r)return null;
      const len=new Date(r.e)-new Date(r.s);
      pe=new Date(new Date(r.s).getTime()-1);
      ps=new Date(pe.getTime()-len);
    }
    const pss=ps.toISOString().slice(0,10),pse=pe.toISOString().slice(0,10);
    const pfdate=(items,field='date')=>items.filter(i=>(i[field]||'')>=pss&&(i[field]||'')<=pse);
    const pL=pfdate(ecFilter(rawKpi.filter(r=>r.kpiType==='leads')));
    const pFF=pfdate(ecFilter(rawKpi.filter(r=>r.kpiType==='footfall')));
    const pAF=pfdate(ecFilter(rawKpi.filter(r=>r.kpiType==='archFb')));
    const pAu=pfdate(ecFilter(rawKpi.filter(r=>r.kpiType==='audits')));
    const pSW=pfdate(ecFilter(rawKpi.filter(r=>r.kpiType==='showroom')));
    const pConv=pL.filter(l=>l.convertedToVisit).length;
    const pAfAvg=pAF.length?pAF.reduce((a,f)=>a+f.rating,0)/pAF.length:0;
    const pAuSc=pAu.reduce((a,s)=>a+s.score,0),pAuMx=pAu.reduce((a,s)=>a+s.maxScore,0);
    const pSwAvg=pSW.length?pSW.reduce((a,s)=>a+s.score,0)/pSW.length:0;
    return{footfall:pFF.length,convRate:pL.length?Math.round(pConv/pL.length*100):0,sat:Math.round(pAfAvg*20),audit:pAuMx?Math.round(pAuSc/pAuMx*100):0,showroom:parseFloat(pSwAvg.toFixed(1)),leads:pL.length};
  },[selDate,customFrom,customTo,rawKpi,ecFilter]);

  // allData object for analytics & insights
  const allData=useMemo(()=>({
    salesPlans:fPlans,leads:fL,archs:fA,footfall:fFF,showroom:fSW,
    datamgmt:fDM,skills:fSk,archFb:fAF,expenses:fEx,audits:fAu,custFb:fCF
  }),[fPlans,fL,fA,fFF,fSW,fDM,fSk,fAF,fEx,fAu,fCF]);

  // Memoize expensive computations to avoid re-running on every render
  const memoInsights=useMemo(()=>generateDataInsights(allData),[allData]);
  const memoActionCenter=useMemo(()=>computeActionCenter(allData,prevStats),[allData,prevStats]);

  // Check if current date range has any data at all
  const hasDataInRange=useMemo(()=>{
    const totalRecords=[...fL,...fFF,...fA,...fSW,...fDM,...fSk,...fAF,...fEx,...fAu,...fCF].length;
    return totalRecords>0;
  },[fL,fFF,fA,fSW,fDM,fSk,fAF,fEx,fAu,fCF]);

  // Format last sync time
  const lastSyncLabel=useMemo(()=>{
    if(!lastSync)return null;
    const mins=Math.floor((Date.now()-lastSync.getTime())/60000);
    if(mins<1)return'Just now';
    if(mins===1)return'1 min ago';
    return mins+'min ago';
  },[lastSync]);

  const manualRefresh=()=>{setDataLoading(true);setRawKpi([]);setRawPlans([]);setTimeout(()=>setDataLoading(false),400);};

  const canEdit=userConfig&&(userConfig.role==='Admin'||userConfig.role==='Manager');
  const isAdmin=userConfig?.role==='Admin';
  const isManager=userConfig?.role==='Manager';
  const canDelete=isAdmin;          // only Admin can delete records
  const canApproveExpense=isAdmin;  // only Admin can approve expenses
  const canEditTargets=isAdmin;     // only Admin can change plan targets

  // Notes CRUD helpers
  const addNote=data=>fsAdd(NOTES_COLLECTION,data);
  const delNote=id=>fsDelete(NOTES_COLLECTION,id);

  const handleLogout=()=>{window._fb.signOut(window._fb.auth);setViewerMode(false);setPage('dashboard');};

  // Render page content
  const renderPage=()=>{
    const kpiProps={add:fsAdd,upd:fsUpdate,del:fsDelete,canEdit,canDelete,canApproveExpense,canEditTargets,showToast};
    if(page==='compare'&&isAdmin)return h(ECComparison,{rawKpi,rawPlans,fdate,selDate,customFrom,customTo});
    const ecLabelStr=currentEc==='combined'?'Both ECs':(EC_LABELS[currentEc]||currentEc);
    const emptyWarn=!hasDataInRange&&!dataLoading&&h(EmptyRangeWarning,{dateLabel:activeDateLabel});
    const dashCommon=h('div',null,
      h(ManagementFilterBar,{selDate,activeDateLabel,currentEc,exceptionFilter,setExceptionFilter,page,setPage,isAdmin}),
      emptyWarn,
      exceptionFilter!=='all'&&h(ExceptionFilterBar,{filter:exceptionFilter,onChange:setExceptionFilter}),
      exceptionFilter!=='all'
        ?h(ExceptionView,{filter:exceptionFilter,allData})
        :h('div',null,
            h(FreshnessSummary,{allData}),
            h(OverviewCards,{stats,prevStats}),
            h(ActionCenter,{allData,prevStats}),
            h(ManagementSummary,{allData,dateLabel:activeDateLabel,ecLabel:ecLabelStr}),
            h(NotesPanel,{notes,addNote,delNote,canDelete,userConfig,selDate,currentEc}),
            h('div',{style:{display:'flex',justifyContent:'flex-end',marginBottom:8}},h(ExportAllBtn,{allData,dateLabel:activeDateLabel}))
          )
    );
    if(page==='dashboard')return h('div',null,
      dashCommon,
      exceptionFilter==='all'&&h('div',null,
        h(Analytics,{allData}),
        h(KPI1,{...kpiProps,data:fL}),
        h(KPI2,{...kpiProps,data:fA}),
        h(KPI3,{...kpiProps,data:fFF}),
        h(KPI4,{...kpiProps,data:fSW}),
        h(KPI5,{...kpiProps,data:fDM}),
        h(KPI6,{...kpiProps,data:fSk}),
        h(KPI7,{...kpiProps,data:fAF}),
        h(KPI8,{...kpiProps,data:fEx}),
        h(KPI9,{...kpiProps,data:fAu}),
        h(KPI10,{data:fPlans,upd:fsUpdate,showToast,canEditTargets}),
        h(KPI11,{...kpiProps,data:fCF})
      )
    );
    if(page==='kpi1')return h(KPI1,{...kpiProps,data:fL,defOpen:true});
    if(page==='kpi2')return h(KPI2,{...kpiProps,data:fA});
    if(page==='kpi3')return h(KPI3,{...kpiProps,data:fFF});
    if(page==='kpi4')return h(KPI4,{...kpiProps,data:fSW});
    if(page==='kpi5')return h(KPI5,{...kpiProps,data:fDM});
    if(page==='kpi6')return h(KPI6,{...kpiProps,data:fSk});
    if(page==='kpi7')return h(KPI7,{...kpiProps,data:fAF});
    if(page==='kpi8')return h(KPI8,{...kpiProps,data:fEx});
    if(page==='kpi9')return h(KPI9,{...kpiProps,data:fAu});
    if(page==='kpi10')return h(KPI10,{data:fPlans,upd:fsUpdate,showToast,canEditTargets});
    if(page==='kpi11')return h(KPI11,{...kpiProps,data:fCF});
    if(page==='analytics')return h(Analytics,{allData});
    return h('div',{style:{color:'rgba(255,255,255,.3)',padding:24}},'Page not found');
  };

  if(!fbReady)return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:13,color:'rgba(255,255,255,.4)',background:'#0A1628'}},'\ud83d\udd04 Connecting to Firebase...');
  if(!authUser&&!viewerMode)return h(ErrorBoundary,null,h(Login,{onLogin:()=>{},onViewer:()=>setViewerMode(true)}));

  // Visible NAV — add compare for admin
  const visibleNav=[...NAV,...(isAdmin?[{id:'compare',ico:'\u2696\ufe0f',lbl:'EC Comparison',sub:'Admin'}]:[] )];

  return h(ErrorBoundary,null,
    h('div',{className:'app'},
    h(LoadingOverlay,{show:dataLoading&&rawKpi.length===0&&rawPlans.length===0}),
    // ── Sidebar ─────────────────────────────────────────────
    h('div',{className:'sb '+(slim?'slim':'wide')},
      h('div',{className:'sb-logo'},
        h('div',{className:'logo-pill'},'AIS'),
        !slim&&h('div',{className:'logo-info'},h('p',null,'AIS Windows'),h('span',null,'EC-KPI Dashboard')),
        h('button',{className:'sb-toggle','aria-label':slim?'Expand sidebar':'Collapse sidebar',onClick:()=>setSlim(!slim)},slim?'\u203a':'\u2039')
      ),
      viewerMode&&!slim&&h('div',{className:'vo-badge'},h('span',{style:{fontSize:11}},'\ud83d\udc41'),h('span',null,'View Only Mode')),
      h('div',{className:'sb-nav'},
        visibleNav.map(n=>h('button',{key:n.id,className:'nav-item'+(page===n.id?' act':''),'aria-label':n.lbl,title:n.lbl,onClick:()=>setPage(n.id)},
          h('div',{className:'nav-ico'},n.ico),
          !slim&&h('div',{className:'nav-txt'},h('p',null,n.lbl),h('span',null,n.sub))
        ))
      ),
      h('div',{className:'sb-foot'},
        h('button',{className:'nav-item','aria-label':'Logout',title:viewerMode?'Exit Viewer':'Logout',onClick:handleLogout,style:{width:'100%'}},
          h('div',{className:'nav-ico'},'\ud83d\udeaa'),
          !slim&&h('div',{className:'nav-txt'},h('p',null,viewerMode?'Exit Viewer':'Logout'),h('span',null,viewerMode?'Go to login':'Sign out'))
        )
      )
    ),
    // ── Main ────────────────────────────────────────────────
    h('div',{className:'main'},
      !isOnline&&h(OfflineBanner),
      // Header
      h('div',{className:'hdr'},
        h('div',{className:'hdr-title'},
          h('p',null,TITLES[page]||page),
          h('span',null,currentEc==='combined'?'Both ECs \u00b7 Combined':(EC_LABELS[currentEc]||currentEc))
        ),
        h('div',{className:'hdr-sep'}),
        // Date filter strip
        h('div',{className:'date-strip'},
          Object.keys(DR).map(d=>h('button',{key:d,className:'dp'+(selDate===d&&selDate!=='Custom'?' act':''),onClick:()=>{setSelDate(d);setShowDatePop(false);}},d)),
          h('button',{className:'dp'+(selDate==='Custom'?' act':''),'aria-label':'Custom date range',onClick:()=>setShowDatePop(v=>!v)},'\ud83d\udcc5 Custom')
        ),
        selDate==='Custom'&&customFrom&&customTo&&h('span',{className:'active-range-lbl'},customFrom+' \u2192 '+customTo),
        h('button',{className:'print-btn','aria-label':'Print dashboard (Ctrl+P)',title:'Print (Ctrl+P)',onClick:()=>window.print()},'\ud83d\udda8 Print'),
        h('div',{className:'hdr-user'},
          h('div',{className:'avatar'},(userConfig?.name||'V')[0].toUpperCase()),
          h('div',null,h('p',null,userConfig?.name||(viewerMode?'Viewer':'User')),h('span',null,viewerMode?'View Only':(userConfig?.role||'Viewer')))
        )
      ),
      // Custom date modal
      showDatePop&&h(CustomDateModal,{from:customFrom,to:customTo,onApply:(f,t)=>{setCustomFrom(f);setCustomTo(t);setSelDate('Custom');setShowDatePop(false);},onClose:()=>setShowDatePop(false)}),
      // Content
      h('div',{className:'content'},
        // EC tab bar (only on dashboard and non-compare pages)
        page!=='compare'&&h(ECTabBar,{ecs:userConfig?.ecs||[],current:currentEc,onChange:setCurrentEc}),
        // Combined view banner
        currentEc==='combined'&&page!=='compare'&&h('div',{style:{padding:'9px 13px',borderRadius:10,background:'rgba(255,215,0,.07)',border:'1px solid rgba(255,215,0,.18)',marginBottom:12,fontSize:9.5,color:'rgba(255,255,255,.6)',display:'flex',alignItems:'center',gap:8}},
          h('span',null,'\ud83d\udcca'),h('span',null,'Combined view — showing data from all Experience Centers. Switch tabs above to filter by EC.')
        ),
        renderPage(),
        // Sync indicator with manual refresh
        (authUser||viewerMode)&&h('div',{style:{textAlign:'center',padding:'12px 0 4px',fontSize:8.5,color:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',gap:8}},
          h('span',{className:'sync-dot'}),
          h('span',{className:'sync-time'},'Live sync \u00b7 AIS Windows \u00b7 Firebase'+(lastSyncLabel?' \u00b7 '+lastSyncLabel:'')),
          h('button',{className:'refresh-btn','aria-label':'Manual refresh',title:'Refresh data',onClick:manualRefresh},'\u21bb Refresh')
        )
      )
    ),
    h(Toast,{msg:toast,onDone:()=>setToast('')})
  ));
}

ReactDOM.createRoot(document.getElementById('root')).render(
  h(ErrorBoundary,null,h(App))
);
</script>
